[project]
name = "mesa-posta-app"
version = "1.0.0"
description = "Mesa Posta, aplicativo completo: convidados, confirmação de presença, mesas e check-in por QR code para cerimonial de casamentos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Leonardo Esquivel Couto" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.7",
    "segno>=1.6",
    "jinja2>=3.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["mesa"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]
