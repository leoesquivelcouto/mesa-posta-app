# Sobe tudo com: docker compose up --build
# Aplicativo em http://localhost:8000 (API JSON e documentação em /api/docs)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa-local}
      POSTGRES_DB: mesa
    volumes:
      - dados-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa -d mesa"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://mesa:${POSTGRES_PASSWORD:-mesa-local}@db:5432/mesa
      SEGREDO_JWT: ${SEGREDO_JWT:?defina SEGREDO_JWT no .env (veja .env.example)}
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:8000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-pg:
