<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Mesa Posta{% endblock %}</title>
  <meta name="theme-color" content="#2f5d50">
  <link rel="icon" href="/static/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/estilo.css?v=2">
</head>
<body class="{% block classe_body %}{% endblock %}">
  {% block topo %}
  <header class="topo">
    <a class="marca" href="{{ '/eventos' if usuario else '/' }}"><img src="/static/icone.svg" alt="" width="26" height="26"> Mesa Posta</a>
    {% if usuario %}
    <nav class="topo-acoes">
      <a href="/eventos">Meus eventos</a>
      <span class="quem" title="{{ usuario.email }}">{{ usuario.nome.split()[0] }}</span>
      <form method="post" action="/sair"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Sair</button></form>
    </nav>
    {% endif %}
  </header>
  {% endblock %}

  {% if aviso %}
  <div class="aviso aviso-{{ aviso.tipo }}" role="status" data-aviso>
    <span>{{ aviso.texto }}</span>
    <button type="button" class="fechar" aria-label="Fechar aviso" onclick="this.parentElement.remove()">×</button>
  </div>
  {% endif %}

  <main class="{% block classe_main %}conteudo{% endblock %}">
    {% block conteudo %}{% endblock %}
  </main>
  <script src="/static/app.js?v=1" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
